<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2026 서울국제도서전 MAP_JWver</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="서국도 맵">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#F7F7F5">
<style>
:root{
  --paper:#F7F7F5; --paper-deep:#EFEFED;
  --ink:#111111; --ink-soft:#8A8A86;
  --line:#DDDDDA; --booth:#FFFFFF; --booth-line:#111111;
  --c-exhibition:#111111; --c-lecture:#F5CE00; --c-village:#5BC2E7;
  --c-event:#F47920; --c-cafe:#8E7CC3; --c-toilet:#7A8B8F;
  --fav:#01FF01; --wish:#1A6E5A; --goods:#B05A1E;
  --neon:#01FF01;
  --radius:10px;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box;}
/* 루트 캔버스 배경 — 하단 safe area(홈 인디케이터 뒤)와 오버스크롤 바운스 영역까지
   페이지 배경색이 끊김 없이 이어지도록 html에 명시 */
html{background:var(--paper-deep);}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;}
body{
  height:100vh;                  /* 폴백 */
  height:-webkit-fill-available; /* 구형 iOS Safari */
  height:100dvh;                 /* 동적 뷰포트: 주소창 제외 실제 가시 높이 */
  min-height:100dvh;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--paper-deep); color:var(--ink);
}

/* ── 상단 플로팅 레이어 (검색 캡슐 + 원형 메뉴 + 홀 칩) ── */
header{position:fixed;top:0;left:0;right:0;z-index:45;
  display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;
  background:none;border:0;pointer-events:none;}
.top-row{display:flex;align-items:center;gap:10px;position:relative;}
/* ── [지도|목록] 플로팅 세그먼트 토글 (좌상단) ── */
.seg{display:flex;flex:none;border:1.5px solid var(--ink);border-radius:999px;background:#fff;
  padding:4px;gap:4px;box-shadow:0 2px 10px rgba(17,17,17,.1);pointer-events:auto;margin-right:auto;}
.seg-btn{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border:0;border-radius:999px;
  background:none;font:inherit;font-size:0.88rem;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .25s ease-out;}
.seg-btn svg{flex:none;}
.seg-btn svg path{stroke:var(--ink);}
.seg-btn.active{background:var(--ink);color:#fff;}
.seg-btn.active svg path{stroke:#fff;}
/* ── 우상단 원형 검색 버튼 + 펼침형 검색 캡슐 ── */
.searchbox{position:absolute;inset:0;display:flex;align-items:center;gap:8px;pointer-events:none;
  opacity:0;transform:scaleX(.6);transform-origin:right center;
  transition:opacity .25s ease-out,transform .25s ease-out;z-index:5;}
.searchbox.open{opacity:1;transform:scaleX(1);pointer-events:auto;}
.searchbox input{flex:1;height:46px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;
  padding:0 18px;font:inherit;font-size:0.92rem;outline:none;color:var(--ink);min-width:0;
  box-shadow:0 2px 10px rgba(17,17,17,.1);}
.searchbox input:focus{box-shadow:0 0 0 3px rgba(1,255,1,.35),0 2px 10px rgba(17,17,17,.1);}
.search-close{flex:none;width:46px;height:46px;border:1.5px solid var(--ink);border-radius:50%;
  background:#fff;color:var(--ink);font-size:1.05rem;font-weight:700;cursor:pointer;
  box-shadow:0 2px 10px rgba(17,17,17,.1);}
.search-results{position:absolute;top:52px;left:0;right:0;background:#fff;border:1.5px solid var(--ink);
  border-radius:14px;max-height:300px;overflow:auto;display:none;box-shadow:0 10px 24px rgba(17,17,17,.16);}
.search-results.open{display:block;}
.search-results button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 14px;border:0;
  background:none;font:inherit;text-align:left;cursor:pointer;border-bottom:1px solid var(--line);}
.search-results button:last-child{border-bottom:0;}
.search-results button:hover{background:rgba(1,255,1,.14);}
.chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  pointer-events:auto;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;min-height:38px;padding:0 18px;border:1.5px solid var(--ink);border-radius:999px;
  background:#fff;font:inherit;font-size:0.84rem;font-weight:700;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 8px rgba(17,17,17,.07);transition:background .25s ease-out;}
.chip.active{background:var(--neon);}
.sr-id{font-size:0.7rem;font-weight:700;color:var(--ink-soft);min-width:52px;}
.sr-dot{width:9px;height:9px;border-radius:50%;flex:none;}
.sr-empty{padding:14px;color:var(--ink-soft);font-size:0.85rem;}

/* ── 레이아웃 (뷰포트에 직접 고정 — 지도 배경이 safe-area 포함 화면 끝까지) ── */
.layout{position:fixed;inset:0;display:flex;}

/* ── 원형 플로팅 버튼 (검색) ── */
.menu-btn{flex:none;width:46px;height:46px;border:1.5px solid var(--ink);border-radius:50%;
  background:#fff;color:var(--ink);font-size:1.2rem;line-height:1;cursor:pointer;
  box-shadow:0 2px 10px rgba(17,17,17,.1);pointer-events:auto;}
.menu-btn:hover{background:var(--ink);color:#fff;}

.empty-note{color:var(--ink-soft);font-size:0.9rem;line-height:1.65;padding:24px 8px;text-align:center;}

/* ── 지도 ── */
.map-wrap{flex:1;position:relative;overflow:hidden;background:var(--paper-deep);touch-action:none;}
#map{width:100%;height:100%;cursor:grab;display:block;}
#map.dragging{cursor:grabbing;}
svg text{user-select:none;pointer-events:none;text-rendering:geometricPrecision;}
.booth{stroke:var(--booth-line);stroke-width:0.45;transition:opacity .2s;cursor:pointer;}
.booth:hover{filter:brightness(0.95);}
.booth.favored{stroke:var(--neon);stroke-width:1.2;}
.booth.pulse{animation:pulse 1.5s ease-out;}
@keyframes pulse{
  0%{stroke:var(--neon);stroke-width:.8;filter:drop-shadow(0 0 1px var(--neon));}
  50%{stroke:var(--neon);stroke-width:3;filter:drop-shadow(0 0 6px var(--neon));}
  100%{stroke:var(--neon);stroke-width:.8;filter:none;}}
.booth-star{cursor:pointer;}
.booth-star:hover{opacity:.7;}

/* ── 플로팅 줌 컨트롤 (우측, 원형 +/−) ── */
.float-ctrl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  display:flex;flex-direction:column;gap:8px;z-index:44;}
.float-ctrl button{width:46px;height:46px;border:1.5px solid var(--ink);border-radius:50%;
  background:#fff;color:var(--ink);font-size:1.3rem;font-weight:700;cursor:pointer;
  box-shadow:0 2px 10px rgba(17,17,17,.1);}
.float-ctrl button:hover{background:var(--ink);color:#fff;}
/* 북마크 카운터: 줌 스택 최상단의 네온 그린 원형 버튼 (블랙 아이콘) */
.float-ctrl .fc-fav{position:relative;background:var(--neon);display:flex;align-items:center;justify-content:center;}
.float-ctrl .fc-fav:hover{background:var(--neon);filter:brightness(.92);}
.fc-fav svg path{stroke:#111111;}
.fab-badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;
  border-radius:99px;background:var(--neon);border:1.5px solid var(--ink);
  font-size:0.68rem;font-weight:800;color:var(--ink);display:flex;align-items:center;justify-content:center;}
body.list-open .float-ctrl{display:none;}

/* ── 목록 뷰 (탭 + 존별 섹션 스크롤 리스트) ── */
.list-view{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 120px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);}
.list-view.open{display:block;}
/* 목록 탭 [전체|즐겨찾기|위시리스트] */
.lv-tabs{display:flex;gap:8px;margin-bottom:18px;}
.lv-tab{flex:1;min-height:40px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;
  font:inherit;font-size:0.86rem;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .25s ease-out;}
.lv-tab.active{background:var(--neon);}
.lv-wishn{flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--neon);
  border:1px solid var(--ink);font-size:0.68rem;font-weight:800;color:var(--ink);
  display:flex;align-items:center;justify-content:center;}
.lv-zone{margin-bottom:18px;}
.lv-zone h4{display:inline-block;background:var(--ink);color:var(--neon);font-size:0.72rem;
  font-weight:800;letter-spacing:0.06em;border-radius:99px;padding:4px 12px;margin-bottom:8px;}
.lv-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
.lv-item:hover{border-color:var(--ink);}
.lv-item b{flex:1;min-width:0;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lv-item .lv-id{flex:none;font-size:0.7rem;font-weight:700;color:var(--ink-soft);}
.lv-bm{flex:none;width:38px;height:38px;margin:-6px -4px -6px -8px;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.lv-bm svg path{fill:none;stroke:#8A8A86;stroke-width:2;}
.lv-bm.on svg path{fill:var(--neon);stroke:#111111;}
.map-hint{position:absolute;left:16px;bottom:18px;z-index:10;font-size:0.68rem;color:var(--ink-soft);
  background:rgba(247,247,245,.9);padding:6px 10px;border-radius:8px;border:1px solid var(--line);}

/* ── 모달 ── */
.modal-bg{position:fixed;inset:0;background:rgba(23,21,15,.45);display:none;align-items:center;
  justify-content:center;z-index:50;padding:20px;}
.modal-bg.open{display:flex;}
.modal{width:100%;max-width:400px;max-height:86vh;max-height:86dvh;overflow:auto;background:#fff;
  border:2px solid var(--ink);border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(17,17,17,.3);}
.modal .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.cat-badge{display:inline-flex;align-items:center;gap:7px;font-size:0.7rem;font-weight:700;
  letter-spacing:0.05em;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:#fff;}
.cat-badge i{width:9px;height:9px;border-radius:50%;}
.star-btn{border:0;background:none;font-size:1.7rem;line-height:1;cursor:pointer;color:#B9B9B5;padding:2px;}
.star-btn.is-fav{color:var(--neon);text-shadow:0 0 1px var(--ink);}
.modal h2{margin:12px 0 2px;font-size:1.25rem;letter-spacing:-0.02em;}
.modal .booth-no{font-size:0.78rem;color:var(--ink-soft);font-weight:700;}
.modal p{margin:10px 0 14px;font-size:0.86rem;line-height:1.6;color:var(--ink-soft);}
.wish-sec{border-top:1.5px dashed var(--line);padding-top:14px;margin-bottom:16px;}
.wish-sec h4{font-size:0.8rem;margin-bottom:8px;}
.wish-sec ul{list-style:none;margin-bottom:10px;}
.wish-sec li{display:flex;align-items:center;gap:8px;font-size:0.86rem;padding:6px 8px;background:#fff;
  border:1px solid var(--line);border-radius:8px;margin-bottom:5px;}
.wish-sec li.book::before{content:"📖";}
.wish-sec li.goods::before{content:"🎁";}
.wish-sec li .del{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--ink-soft);}
.wish-sec li .del:hover{color:var(--fav);}
.wish-input{display:flex;gap:6px;}
.wish-input input{flex:1;height:36px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;
  font:inherit;font-size:0.86rem;outline:none;background:#fff;}
.wish-input input:focus{border-color:var(--wish);}
.wish-input button{padding:0 16px;border:1.5px solid var(--wish);border-radius:8px;background:var(--wish);
  color:#fff;font:inherit;font-size:0.84rem;font-weight:700;cursor:pointer;}
.wish-input button:hover{filter:brightness(1.1);}
.wish-input.goods input:focus{border-color:var(--goods);}
.wish-input.goods button{border-color:var(--goods);background:var(--goods);}
.wish-subhead{font-size:0.72rem;letter-spacing:0.1em;color:var(--ink-soft);
  margin:18px 0 8px;text-transform:uppercase;font-weight:800;}
.wish-subhead:first-of-type{margin-top:6px;}
.wish-empty{font-size:0.78rem;color:var(--ink-soft);margin-bottom:10px;}
.btn-close{width:100%;padding:11px 0;border-radius:999px;font:inherit;font-weight:700;font-size:0.88rem;
  cursor:pointer;border:1.5px solid var(--ink);background:none;}
.btn-close:hover{background:var(--ink);color:var(--paper);}

/* ── 부스 공식 SNS ── */
.sns-sec{border-top:1.5px dashed var(--line);padding-top:14px;margin-bottom:16px;}
.sns-sec .sns-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.sns-sec h4{font-size:0.8rem;}
.sns-edit-toggle{border:0;background:none;font:inherit;font-size:0.74rem;font-weight:700;
  color:var(--ink-soft);cursor:pointer;text-decoration:underline;}
.sns-edit-toggle:hover{color:var(--ink);}
.sns-chips{display:flex;flex-wrap:wrap;gap:6px;}
.sns-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  font-size:0.8rem;font-weight:700;text-decoration:none;border:1.5px solid transparent;cursor:pointer;}
.sns-chip:hover{filter:brightness(1.08);}
.sns-chip.instagram{background:#FDEEF4;color:#C13584;border-color:#E1A3C4;}
.sns-chip.youtube{background:#FDECEC;color:#CC0000;border-color:#E8A3A3;}
.sns-chip.twitter{background:#EAF1F6;color:#17150F;border-color:#B9C6D0;}
.sns-empty{font-size:0.78rem;color:var(--ink-soft);}
.sns-form{display:none;flex-direction:column;gap:6px;margin-top:8px;}
.sns-form.open{display:flex;}
.sns-row{display:flex;align-items:center;gap:8px;}
.sns-row label{width:74px;flex:none;font-size:0.76rem;font-weight:700;color:var(--ink-soft);}
.sns-row input{flex:1;height:34px;border:1.5px solid var(--line);border-radius:8px;padding:0 10px;
  font:inherit;font-size:0.8rem;outline:none;background:#fff;min-width:0;}
.sns-row input:focus{border-color:var(--ink);}
.sns-form-actions{display:flex;gap:6px;margin-top:4px;}
.sns-form-actions button{flex:1;padding:8px 0;border-radius:8px;font:inherit;font-size:0.8rem;
  font-weight:700;cursor:pointer;}
.sns-save{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);}
.sns-save:hover{filter:brightness(1.25);}
.sns-cancel{border:1.5px solid var(--line);background:none;color:var(--ink-soft);}
.sns-cancel:hover{border-color:var(--ink);color:var(--ink);}

/* ── 모바일 ── */
@media (max-width:760px){
  .map-hint{display:none;}
  .searchbox{max-width:none;}
}
@media (prefers-reduced-motion:reduce){.booth.pulse{animation:none;}.searchbox,.list-view,.chip,.lv-tab{transition:none;}}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="seg" id="viewSeg" role="tablist">
      <button class="seg-btn active" id="segMap" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14" fill="none" stroke-width="2" stroke-linejoin="round"/></svg>
        지도</button>
      <button class="seg-btn" id="segList" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg>
        목록</button>
    </div>
    <button class="menu-btn" id="searchBtn" aria-label="검색 열기">⌕</button>
    <div class="searchbox" id="searchBox">
      <input id="searchInput" type="text" placeholder="부스 번호·출판사 검색 (예: A2001, 문학동네)" autocomplete="off" aria-label="부스 검색">
      <button class="search-close" id="searchClose" aria-label="검색 닫기">✕</button>
      <div class="search-results" id="searchResults" role="listbox"></div>
    </div>
  </div>
  <div class="chips" id="hallChips">
    <button class="chip active" data-hall="all">전체</button>
    <button class="chip" data-hall="A">A홀</button>
    <button class="chip" data-hall="B1">B홀</button>
  </div>
</header>

<div class="layout">
  <div class="map-wrap" id="mapWrap">
    <svg id="map" viewBox="0 0 1024 1170" xmlns="http://www.w3.org/2000/svg" aria-label="부스 배치도">
      <g id="viewport"></g>
    </svg>
    <div class="map-hint">휠·핀치 확대 / 드래그 이동 / 부스 클릭 → 상세·위시리스트 / 우상단 북마크 → 즐겨찾기</div>
  </div>
</div>

<div class="float-ctrl">
  <button class="fc-fav" id="favFab" aria-label="즐겨찾기 목록 열기">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M6 3h12v18l-6-4.5L6 21z" fill="none" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <span class="fab-badge" id="fabFavCount">0</span>
  </button>
  <button id="zoomIn" aria-label="확대">＋</button>
  <button id="zoomOut" aria-label="축소">－</button>
  <button id="zoomReset" aria-label="처음으로">⟲</button>
</div>

<div class="list-view" id="listView">
  <div class="lv-tabs" id="lvTabs">
    <button class="lv-tab active" data-tab="all">전체</button>
    <button class="lv-tab" data-tab="fav">즐겨찾기</button>
    <button class="lv-tab" data-tab="wish">위시리스트</button>
  </div>
  <div id="listContent"></div>
</div>

<!-- 부스 상세 모달 -->
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="top-row">
      <span class="cat-badge"><i id="mCatDot"></i><span id="mCatName"></span></span>
      <button class="star-btn" id="mFavBtn" aria-label="즐겨찾기 토글">☆</button>
    </div>
    <h2 id="mName"></h2>
    <div class="booth-no" id="mNo"></div>
    <p id="mDesc"></p>

    <div class="sns-sec">
      <div class="sns-head">
        <h4>🔗 공식 SNS</h4>
        <button class="sns-edit-toggle" id="mSnsEdit">링크 추가·편집</button>
      </div>
      <div class="sns-chips" id="mSnsChips"></div>
      <div class="sns-form" id="mSnsForm">
        <div class="sns-row"><label for="snsInsta">인스타그램</label>
          <input id="snsInsta" type="text" placeholder="URL 또는 @아이디" maxlength="120"></div>
        <div class="sns-row"><label for="snsYoutube">유튜브</label>
          <input id="snsYoutube" type="text" placeholder="URL 또는 @채널명" maxlength="120"></div>
        <div class="sns-row"><label for="snsTwitter">트위터(X)</label>
          <input id="snsTwitter" type="text" placeholder="URL 또는 @아이디" maxlength="120"></div>
        <div class="sns-form-actions">
          <button class="sns-save" id="mSnsSave">저장</button>
          <button class="sns-cancel" id="mSnsCancel">취소</button>
        </div>
      </div>

/* ── (3) ZONES → 개별 부스 좌표 분할 ──
   두 가지 구역 정의 방식 지원:
   (A) cols 방식: z.cols = [[cell,...], ...] — 단일 블록, 좌→우 열. 각 열은 dir 방향(기본 아래→위).
   (B) subBlocks 방식: z.sub = [{wr:폭비율, cols:[[cell,...],...]}, ...] — 블록 사이 통로(gap) 자동.
       각 서브블록 내부 cols는 위→아래(top-down)로 나열(PDF 시각순서 그대로). */
function buildBooths(){
  const out = [...SPECIAL];
  let curBlock = null;

  function placeCols(cols, bx, by, bw, bh, dir, hall, blockOf){
    const realCols = cols.filter(c=>c!==null);
    const nCols = realCols.length;
    const spacerCount = cols.length - nCols;
    const unit = (bw - BOOTH_GAP*(cols.length-1)) / (nCols + spacerCount*0.35);
    let cx = bx;
    cols.forEach((col)=>{
      if(col===null){ cx += unit*0.35 + BOOTH_GAP; return; }
      const cw = unit;
      const nRows = col.length;
      const ch = (bh - BOOTH_GAP*(nRows-1)) / nRows;
      col.forEach((cell,ri)=>{
        if(!cell){ return; } /* 빈 칸(블록 내 결번) 건너뜀 */
        const yIdx = (dir==="down") ? ri : (nRows-1-ri);
        const cy = by + yIdx*(ch+BOOTH_GAP);
        out.push({
          id:cell.n, name:cell.t||cell.n, cat:"booth",
          x:+(cx).toFixed(1), y:+(cy).toFixed(1), w:+(cw).toFixed(1), h:+(ch).toFixed(1),
          hall:hall, block:blockOf, big:cell.big||undefined,
          desc:`${blockOf||hall+"홀"} 구역 · ${hall}홀 일반 부스`
        });
      });
      cx += cw + BOOTH_GAP;
    });
  }

  ZONES.forEach(z=>{
    if(z.label) curBlock = z.label;
    const blockOf = z.label || curBlock;
    const dir = z.dir || "down"; /* subBlocks 기본은 top-down */

    if(z.sub){
      /* 서브블록 방식: wr 비율로 폭 분배, 블록 사이 BLOCK_GAP */
      const BLOCK_GAP = z.blockGap!=null ? z.blockGap : 6;
      const nB = z.sub.length;
      const totalWr = z.sub.reduce((s,b)=>s+b.wr,0);
      const avail = z.w - BLOCK_GAP*(nB-1);
      let bx = z.x;
      z.sub.forEach(sb=>{
        const bw = avail * (sb.wr/totalWr);
        placeCols(sb.cols, bx, z.y, bw, z.h, sb.dir||dir, z.hall, blockOf);
        bx += bw + BLOCK_GAP;
      });
    }else{
      /* 기존 cols 방식 (단일 블록) — 기본 dir 아래→위 유지 */
      placeCols(z.cols, z.x, z.y, z.w, z.h, z.dir||"up", z.hall, blockOf);
    }
  });

  return out;
}
const BOOTHS = buildBooths();

function computeHallBounds(){
  const out={};
  ["B1","A"].forEach(h=>{
    const items=BOOTHS.filter(b=>b.hall===h && !b.fac && !b.corridor);
    const x1=Math.min(...items.map(b=>b.x)),  y1=Math.min(...items.map(b=>b.y));
    const x2=Math.max(...items.map(b=>b.x+b.w)), y2=Math.max(...items.map(b=>b.y+b.h));
    out[h]={x:x1-HALL_PAD, y:y1-HALL_PAD, w:(x2-x1)+HALL_PAD*2, h:(y2-y1)+HALL_PAD*2};
  });
  return out;
}

function el(tag,attrs={},parent=viewport){

function truncate(s,n){ return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* 라벨 줄바꿈: 구분자(·, 공백, /, +) 우선으로 단어를 나눠 칸 폭(maxChars)에 맞게 줄을 채움.
   maxLines를 넘으면 마지막 줄 끝에 '…' 표기. 단어 하나가 너무 길면 강제로 끊음. */
function wrapLabel(text, maxChars, maxLines){
  if(maxChars<2) maxChars=2;
  /* 구분자를 토큰 경계로: 가운뎃점/슬래시/플러스는 그 자리에서, 공백은 단순 분리 */
  const rawTokens = text.split(/(?<=[·/+])|\s+/).filter(t=>t.length>0);
  /* 토큰이 maxChars보다 길면 글자 단위로 잘라 하위 토큰 생성 */
  const tokens=[];
  rawTokens.forEach(tk=>{
    if(tk.length<=maxChars){ tokens.push(tk); }
    else{ for(let i=0;i<tk.length;i+=maxChars) tokens.push(tk.slice(i,i+maxChars)); }
  });
  const lines=[];
  let cur="";
  for(const tk of tokens){
    const cand = cur ? (cur+tk) : tk;
    if(cand.length<=maxChars){ cur=cand; }
    else{ if(cur) lines.push(cur); cur=tk; }
  }
  if(cur) lines.push(cur);
  /* 최대 줄 수 초과 시 마지막 줄에 말줄임 */
  if(lines.length>maxLines){
    lines.length=maxLines;
    let last=lines[maxLines-1];
    last = last.length>=maxChars ? last.slice(0,maxChars-1)+"…" : last+"…";
    lines[maxLines-1]=last;
  }
  return lines;
}

      el("rect",{x:cx-50,y:s.y+23,width:100,height:27,rx:3,fill:"#EFEFED",
        stroke:"#8A8A86","stroke-width":0.7,"stroke-dasharray":"2.5 2"});
      const k=el("text",{x:cx,y:s.y+34,"font-size":9,"font-weight":800,fill:"#111111","text-anchor":"middle"});k.textContent=s.ko;
      const e2=el("text",{x:cx,y:s.y+45,"font-size":6,"font-weight":700,fill:"#8A8A86","text-anchor":"middle"});e2.textContent=s.en;
    }else if(s.type==="arrow"){
      const t=el("text",{x:s.x,y:s.y,"font-size":18,"font-weight":900,fill:"#111111","text-anchor":"middle"});t.textContent="⇅";
    }
  });

  /* 블록 라벨 (A2000, B500 …) — 블랙 필 배지 + 네온 그린 텍스트, 간격 상수 참조 */
  BLOCKS.forEach(s=>{
    const lw=s.label.length*4.6+7, lh=ZONE_LABEL_H;
    el("rect",{x:s.x,y:s.y-lh-ZONE_LABEL_GAP,width:lw,height:lh,rx:4.5,fill:"#111111"});
    const t=el("text",{x:s.x+lw/2,y:s.y-lh/2-ZONE_LABEL_GAP,"font-size":6.6,"font-weight":800,fill:"#01FF01",
      "text-anchor":"middle","dominant-baseline":"central"});
    t.textContent=s.label;
  });

  /* 부스 */
  BOOTHS.forEach(b=>{
    const g=el("g",{class:"booth-g","data-id":b.id});
    const dark=(b.cat==="exhibition");

    /* 시설(화장실·티켓데스크): 점선 보더 회색 박스 + 아이콘/라벨.
       부스와 구분 — 북마크·위시 배지 없음, 탭(.booth) 대상 아님 */
    if(b.fac){
      el("rect",{x:b.x,y:b.y,width:b.w,height:b.h,rx:2,fill:"#EFEFED",
        stroke:"#8A8A86","stroke-width":0.7,"stroke-dasharray":"2.5 2"},g);
      if(b.cat==="toilet"){
        const t=el("text",{x:b.x+b.w/2,y:b.y+b.h/2,"text-anchor":"middle","dominant-baseline":"central",
          "font-size":Math.min(12,b.h*0.6),fill:"#111111","font-weight":800},g);
        t.textContent="🚻";
      }else{
        const t=el("text",{x:b.x+b.w/2,y:b.y+b.h/2-3.5,"text-anchor":"middle","dominant-baseline":"central",
          "font-size":5.6,"font-weight":800,fill:"#111111"},g);
        t.textContent="티켓·인포데스크";
        const t2=el("text",{x:b.x+b.w/2,y:b.y+b.h/2+4.5,"text-anchor":"middle","dominant-baseline":"central",
          "font-size":4.2,"font-weight":700,fill:"#8A8A86"},g);
        t2.textContent="Ticket Office·Information";
      }
      return;
    }

    const rect=el("rect",{class:"booth","data-id":b.id,x:b.x,y:b.y,width:b.w,height:b.h,rx:2,
      fill:CATEGORIES[b.cat].color},g);
    /* 클릭 처리는 pointerup 탭 판정(endPtr)에서 일괄 수행 */

    /* 이름 라벨 */
    if(b.cat==="toilet"){
      const t=el("text",{x:b.x+b.w/2,y:b.y+b.h/2,"text-anchor":"middle","dominant-baseline":"central",
        "font-size":Math.min(11,b.h*0.55),fill:"#fff","font-weight":800},g);
      t.textContent="🚻";
    }else{
      /* 칸 폭/높이에 맞춰 폰트와 줄 수를 동적으로 산정해 잘림을 최소화.
         - 기본 5.4px에서 칸 크기에 따라 5.0~6.6px로 가변
         - 단어(·, 공백, 슬래시 등) 단위로 줄바꿈, 칸 높이에 맞는 최대 줄 수만 표시
         - ID 라벨(부제) 공간을 칸이 클 때만 확보 */
      const showId = b.h>30;                              /* 큰 칸만 하단에 ID 표기 */
      const fs = Math.max(5.0, Math.min(6.6, b.w*0.085, b.h*0.16)); /* 칸 비례 폰트 */
      const lineH = fs*1.12;
      const padX = 2.2;                                   /* 좌우 여백 */
      const usableW = Math.max(8, b.w - padX*2);
      const charW = fs*0.92;                              /* 한글 1자 폭 근사 */
      const maxCharsPerLine = Math.max(3, Math.floor(usableW/charW));

      /* 이름+ID가 차지할 세로 영역 계산: ID는 한 줄(약 lineH*0.8) */
      const idReserve = showId ? lineH*0.92 : 0;
      const usableH = b.h - 3 - idReserve;
      const maxLines = Math.max(1, Math.floor(usableH/lineH));

      const lines = wrapLabel(b.name, maxCharsPerLine, maxLines);
      /* 이름 블록을 칸 중앙(또는 ID가 있으면 약간 위)에 정렬 */
      const blockH = lines.length*lineH;
      const centerY = b.y + (b.h - idReserve)/2;
      const startY = centerY - blockH/2 + lineH/2;

      const t=el("text",{class:"booth-label",x:b.x+b.w/2,y:startY,
        "text-anchor":"middle","dominant-baseline":"central","font-size":fs,
        "font-weight":b.big||b.cat!=="booth"?800:600,
        fill:dark?"#F7F7F5":"#111111"},g);
      lines.forEach((ln,i)=>{
        const ts=document.createElementNS(NS,"tspan");
        ts.setAttribute("x", b.x+b.w/2);
        ts.setAttribute("y", startY + i*lineH);
        ts.textContent = ln;
        t.appendChild(ts);
      });

      if(showId){
        const t2=el("text",{x:b.x+b.w/2,y:b.y+b.h-3,"text-anchor":"middle","dominant-baseline":"central",
          "font-size":fs*0.72,"font-weight":700,fill:dark?"rgba(247,247,245,.7)":"#8A8A86"},g);
        t2.textContent=b.id.replace("A2402W","A2402").replace("A601R","");
      }
    }

    /* 🔖 즐겨찾기 북마크 토글 (부스 우상단) — 비활성: 회색 외곽선 / 활성: 그린 채움+블랙 외곽선 */
    const ssBase=Math.max(5,Math.min(9,b.h*0.4));
    const ss=ssBase*0.8;                          /* 시각 크기 20% 축소 */
    const bw=ss*0.72, bx=b.x+b.w-bw-1.4, by=b.y+1.4;
    const isFav=state.favorites.has(b.id);
    const star=el("path",{class:"booth-star","data-id":b.id,
      d:`M${bx},${by} h${bw} v${ss} l${-bw/2},${-ss*0.34} l${-bw/2},${ss*0.34} z`,
      fill:isFav?"#01FF01":"none","stroke-width":0.6,
      stroke:isFav?"#111111":(dark?"#CFCFCC":"#8A8A86")},g);
    star.style.pointerEvents="auto";

    /* 북마크 터치 히트 영역 — 축소 전(ssBase) 기준 유지, 시각 크기만 줄임 */
    const hs=Math.max(10,ssBase*1.6);
    const hit=el("rect",{class:"booth-star","data-id":b.id,
      x:b.x+b.w-hs, y:b.y, width:hs, height:hs,
      fill:"transparent"},g);
    hit.style.cursor="pointer";

    /* 📖 책 / 🎁 굿즈 위시리스트 개수 배지 (부스 좌하단, 나란히 표시) */
    drawWishBadges(g,b);
  });
}

/* 책·굿즈 위시 배지를 부스 좌하단에 나란히 그림 */
function drawWishBadges(g,b){
  g.querySelectorAll(".wish-badge").forEach(n=>n.remove());
  const bs=Math.max(4.5,Math.min(7,b.h*0.32));
  let x=b.x+1.5;
  [["book","#1A6E5A","📖"],["goods","#B05A1E","🎁"]].forEach(([type,color,icon])=>{
    const n=(WISH_TYPES[type].data()[b.id]||[]).length;
    if(!n) return;
    const w=document.createElementNS(NS,"text");
    w.setAttribute("class","wish-badge");
    w.setAttribute("x",x); w.setAttribute("y",b.y+b.h-1.5);
    w.setAttribute("font-size",bs); w.setAttribute("font-weight",900); w.setAttribute("fill",color);
    w.textContent=icon+n;
    g.appendChild(w);
    x+=bs*(2.0+String(n).length*0.6); /* 다음 배지 가로 오프셋 */
  });
}

/* 부스 한 개만 다시 그리는 대신 가벼운 갱신 */
function refreshBoothMark(id){
  const b=boothById(id); if(!b) return;
  const g=viewport.querySelector(`.booth-g[data-id="${CSS.escape(id)}"]`);
  if(!g) return;

}

/* ============================================================
   5. 팬 / 줌 (휠·드래그·핀치) — 벡터 SVG라 확대해도 글자 선명
   ============================================================ */
function applyTransform(){viewport.setAttribute("transform",`translate(${state.tx} ${state.ty}) scale(${state.scale})`);}
function clientToSvg(cx,cy){return new DOMPoint(cx,cy).matrixTransform(svg.getScreenCTM().inverse());}
function zoomAt(cx,cy,f){
  const p=clientToSvg(cx,cy);
  const ns=Math.min(state.maxScale,Math.max(state.minScale,state.scale*f));
  const k=ns/state.scale;
  state.tx=p.x-k*(p.x-state.tx); state.ty=p.y-k*(p.y-state.ty); state.scale=ns;
  applyTransform();
}
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15);},{passive:false});

const pointers=new Map(); let lastPinch=0;
/* 탭(클릭) 판정용: setPointerCapture가 click 이벤트를 SVG 루트로 가로채므로
   누른 지점→뗀 지점 이동 거리로 직접 탭을 판정한다 */
let tapInfo=null;
const TAP_DIST=7; // px 이하 이동이면 탭으로 간주

svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    svg.classList.add("dragging");
    tapInfo={x:e.clientX,y:e.clientY,target:e.target};
  }else{
    tapInfo=null; // 두 손가락(핀치)은 탭 아님
  }
});
svg.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);
  if(pointers.size===1){
    const p1=clientToSvg(prev.x,prev.y),p2=clientToSvg(e.clientX,e.clientY);
    state.tx+=p2.x-p1.x; state.ty+=p2.y-p1.y; applyTransform();
  }else if(pointers.size===2){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...pointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(lastPinch>0) zoomAt((pts[0].x+pts[1].x)/2,(pts[0].y+pts[1].y)/2,d/lastPinch);
    lastPinch=d; return;
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
function endPtr(e){
  /* 탭 판정: 한 손가락으로 누른 뒤 거의 움직이지 않고 뗐다면 클릭으로 처리 */
  if(tapInfo && pointers.size===1){
    const moved=Math.hypot(e.clientX-tapInfo.x, e.clientY-tapInfo.y);
    if(moved<=TAP_DIST){
      const t=tapInfo.target;
      const starEl=t.closest ? t.closest(".booth-star") : null;
      const boothEl=t.closest ? t.closest(".booth") : null;
      if(starEl){ toggleFav(starEl.dataset.id); }
      else if(boothEl){ openModal(boothEl.dataset.id); }
    }
  }
  tapInfo=null;
  pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0;if(!pointers.size)svg.classList.remove("dragging");}
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);

function centerZoom(f){const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f);}
document.getElementById("zoomIn").onclick=()=>centerZoom(1.3);
document.getElementById("zoomOut").onclick=()=>centerZoom(1/1.3);
document.getElementById("zoomReset").onclick=()=>{state.scale=1;state.tx=0;state.ty=0;applyTransform();};

function focusBooth(id,openDetail=false){
  const b=boothById(id); if(!b)return;
  const vb=svg.viewBox.baseVal, s=4.5;
  state.scale=s;
  state.tx=vb.width/2 - s*(b.x+b.w/2);
  state.ty=vb.height/2 - s*(b.y+b.h/2);
  applyTransform();
  const rect=viewport.querySelector(`.booth[data-id="${CSS.escape(id)}"]`);
  if(rect){rect.classList.remove("pulse");void rect.getBBox;rect.classList.add("pulse");
    setTimeout(()=>rect.classList.remove("pulse"),2600);}
  if(openDetail) openModal(id);
}

/* ============================================================
   9.5 부스별 공식 SNS 링크 (인스타·유튜브·트위터)
   ============================================================ */
const SNS_PLATFORMS = {
  instagram:{label:"인스타그램", icon:"📷", base:"https://www.instagram.com/"},
  youtube:  {label:"유튜브",     icon:"▶",  base:"https://www.youtube.com/@"},
  twitter:  {label:"트위터(X)",  icon:"𝕏",  base:"https://x.com/"},
};
function saveSnsStore(){Store.set("sibf26_sns",state.sns);}

/* 입력 정규화: 전체 URL은 그대로, @아이디·아이디는 플랫폼 URL로 변환 */
function normalizeSns(platform,v){
  v=(v||"").trim();
  if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  v=v.replace(/^@/,"");
  return SNS_PLATFORMS[platform].base+encodeURIComponent(v);
}
/* 저장된 URL → 입력창 표시용(가능하면 @아이디 형태로 되돌림) */
function snsDisplayValue(platform,url){
  if(!url) return "";
  const base=SNS_PLATFORMS[platform].base;
  if(url.startsWith(base)) return "@"+decodeURIComponent(url.slice(base.length));
  return url;
}

const snsForm=document.getElementById("mSnsForm");
const snsInputs={instagram:document.getElementById("snsInsta"),
                 youtube:document.getElementById("snsYoutube"),
                 twitter:document.getElementById("snsTwitter")};

function renderModalSns(id){
  if(modalId!==id)return;
  const chips=document.getElementById("mSnsChips");
  const links=state.sns[id]||{};
  const keys=Object.keys(SNS_PLATFORMS).filter(k=>links[k]);
  chips.innerHTML=keys.length
    ? keys.map(k=>`<a class="sns-chip ${k}" href="${links[k]}" target="_blank" rel="noopener noreferrer">
        ${SNS_PLATFORMS[k].icon} ${SNS_PLATFORMS[k].label} ↗</a>`).join("")
    : `<span class="sns-empty">등록된 SNS가 없습니다. '링크 추가·편집'으로 공식 계정을 등록해 보세요.</span>`;
}
function openSnsForm(id){
  const links=state.sns[id]||{};
  Object.keys(snsInputs).forEach(k=>{snsInputs[k].value=snsDisplayValue(k,links[k]||"");});
  snsForm.classList.add("open");
}
function closeSnsForm(){snsForm.classList.remove("open");}

document.getElementById("mSnsEdit").onclick=()=>{
  snsForm.classList.contains("open")?closeSnsForm():openSnsForm(modalId);
};
document.getElementById("mSnsCancel").onclick=closeSnsForm;
document.getElementById("mSnsSave").onclick=()=>{
  const entry={};
  Object.keys(snsInputs).forEach(k=>{
    const url=normalizeSns(k,snsInputs[k].value);
    if(url) entry[k]=url;
  });
  if(Object.keys(entry).length) state.sns[modalId]=entry;
  else delete state.sns[modalId];   /* 전부 비우면 등록 해제 */
  saveSnsStore(); closeSnsForm(); renderModalSns(modalId);
};

/* ============================================================
   10. 부스 상세 모달 (즐겨찾기 ★ + 위시리스트 입력)
   ============================================================ */
const modalBg=document.getElementById("modalBg");
let modalId=null;
function openModal(id){
  const b=boothById(id); if(!b)return;
  modalId=id;
  document.getElementById("mName").textContent=b.name;
  document.getElementById("mNo").textContent=`부스 ${b.id.replace("A2402W","A2402")} · ${b.hall}홀${b.block?` · ${b.block} 구역`:""}`;
  document.getElementById("mDesc").textContent=b.desc;
  document.getElementById("mCatName").textContent=CATEGORIES[b.cat].name;
  document.getElementById("mCatDot").style.background=CATEGORIES[b.cat].color;
  syncModalFav(id); renderModalWish(id); renderModalSns(id); closeSnsForm();
  modalBg.classList.add("open");
  document.getElementById("mWishInput").value="";
  document.getElementById("mGoodsInput").value="";
}
function syncModalFav(id){
  if(modalId!==id)return;
  const btn=document.getElementById("mFavBtn");
  const f=state.favorites.has(id);
  btn.classList.toggle("is-fav",f);
  btn.textContent=f?"★":"☆";
  btn.title=f?"즐겨찾기 해제":"즐겨찾기 추가";
}
function renderModalWish(id){
  if(modalId!==id)return;
  const sections={
    book: {list:"mWishList", empty:"mWishEmpty"},
    goods:{list:"mGoodsList",empty:"mGoodsEmpty"},
  };
  Object.entries(sections).forEach(([type,sel])=>{
    const items=WISH_TYPES[type].data()[id]||[];
    document.getElementById(sel.empty).style.display=items.length?"none":"block";
    const list=document.getElementById(sel.list);
    list.innerHTML=items.map((t,i)=>`<li class="${type}">${t}<button class="del" data-i="${i}" aria-label="삭제">✕</button></li>`).join("");
    list.querySelectorAll(".del").forEach(btn=>{
      btn.onclick=()=>removeWish(type,id,parseInt(btn.dataset.i));
    });
  });
}
document.getElementById("mFavBtn").onclick=()=>toggleFav(modalId);
/* 책 / 굿즈 입력 — 각자 독립 입력창 */
[["mWishInput","mWishAdd","book"],["mGoodsInput","mGoodsAdd","goods"]].forEach(([inpId,btnId,type])=>{
  const inp=document.getElementById(inpId), btn=document.getElementById(btnId);
  btn.onclick=()=>{addWish(type,modalId,inp.value); inp.value=""; inp.focus();};
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();btn.click();}
  });
});
document.getElementById("mCloseBtn").onclick=()=>modalBg.classList.remove("open");
modalBg.addEventListener("click",e=>{if(e.target===modalBg)modalBg.classList.remove("open");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")modalBg.classList.remove("open");});

/* 초기화 */
renderMap(); applyTransform();
</script>
<script>
/* ── 상단 통합 메뉴(햄버거) UI 배선 — 탭 전환·저장 로직은 기존 핸들러를 그대로 사용 ── */
(function(){
  /* 목록 뷰 상태 — 탭(전체/즐겨찾기/위시리스트)과 홀 필터(전체/A/B1)의 조합 */
  let listTab="all", currentHall="all";

  /* ── 우상단 원형 검색 버튼 → 검색 캡슐 펼침 (0.25s ease-out) ── */
  const searchBox=document.getElementById("searchBox");
  const searchInputEl=document.getElementById("searchInput");
  document.getElementById("searchBtn").addEventListener("click",e=>{
    e.stopPropagation();
    searchBox.classList.add("open");
    setTimeout(()=>searchInputEl.focus(),260);
  });
  function closeSearch(){
    searchBox.classList.remove("open");
    document.getElementById("searchResults").classList.remove("open");
    searchInputEl.blur();
  }
  document.getElementById("searchClose").addEventListener("click",closeSearch);
  /* 검색 결과 선택 시(기존 핸들러가 부스 포커스 수행) 캡슐도 접기 */
  document.getElementById("searchResults").addEventListener("click",e=>{
    if(e.target.closest("button[data-id]")) closeSearch();
  });

  /* ── [지도|목록] 세그먼트 토글 + 탭/홀 조합 목록 뷰 ── */
  const segMap=document.getElementById("segMap"), segList=document.getElementById("segList");
  const listView=document.getElementById("listView"), listContent=document.getElementById("listContent");
  const BM_PATH='M6 3h12v18l-6-4.5L6 21z';
  function bmSvg(){return `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="${BM_PATH}"/></svg>`;}

  /* 현재 탭 + 홀 필터의 교집합 부스 (시설·통로 제외) */
  function pickBooths(){
    let arr=BOOTHS.filter(b=>!b.fac && !b.corridor);
    if(listTab==="fav")       arr=arr.filter(b=>state.favorites.has(b.id));
    else if(listTab==="wish") arr=arr.filter(b=>hasWish(b.id));
    if(currentHall!=="all")   arr=arr.filter(b=>b.hall===currentHall);
    return arr;
  }
  function emptyMsg(base){
    /* base=탭 조건만 적용했을 때의 개수 (홀 필터 전) */
    if(currentHall!=="all" && base>0)
      return `선택한 홀에는 해당 부스가 없어요.`;
    if(listTab==="fav")  return `북마크한 부스가 없어요.<br>지도에서 부스의 <b>북마크</b>를 눌러 추가하세요.`;
    if(listTab==="wish") return `위시리스트에 담은 부스가 없어요.<br>부스 상세에서 책·굿즈를 추가하세요.`;
    return `표시할 부스가 없어요.`;
  }
  function buildListView(){
    const pool=pickBooths();
    const inPool=new Set(pool.map(b=>b.id));
    const item=b=>{
      const wn=(listTab==="wish")?`<span class="lv-wishn">${wishCountOf(b.id)}</span>`:"";
      return `<div class="lv-item" data-id="${b.id}">
        <button class="lv-bm${state.favorites.has(b.id)?" on":""}" data-id="${b.id}" aria-label="즐겨찾기 토글">${bmSvg()}</button>
        <b>${b.name}</b>${wn}<span class="lv-id">${b.id.replace("A2402W","A2402")}</span></div>`;
    };
    let html="";
    BLOCKS.forEach(z=>{
      const items=BOOTHS.filter(b=>b.block===z.label && inPool.has(b.id));
      if(!items.length) return;
      html+=`<div class="lv-zone"><h4>${z.label} · ${z.hall}홀</h4>${items.map(item).join("")}</div>`;
    });
    const specials=pool.filter(b=>!b.block);
    if(specials.length)
      html+=`<div class="lv-zone"><h4>특별 부스</h4>${specials.map(item).join("")}</div>`;
    if(html) listContent.innerHTML=html;
    else{
      /* 빈 상태: 탭 조건만 적용한 개수로 메시지 분기 */
      const base=BOOTHS.filter(b=>!b.fac && !b.corridor &&
        (listTab==="fav"?state.favorites.has(b.id):listTab==="wish"?hasWish(b.id):true)).length;
      listContent.innerHTML=`<div class="empty-note">${emptyMsg(base)}</div>`;
    }
  }
  /* 데이터 변경(즐겨찾기·위시) 시: 뱃지 갱신 + 열려 있으면 스크롤 유지하며 목록 갱신
     — toggleFav/addWish/removeWish가 호출 */
  const favBadge=document.getElementById("fabFavCount");
  refreshListView=()=>{
    favBadge.textContent=state.favorites.size;
    if(!listView.classList.contains("open")) return;
    const st=listView.scrollTop; buildListView(); listView.scrollTop=st;
  };
  refreshListView(); /* 초기 뱃지 카운트 (localStorage 복원분 반영) */

  /* 초록 북마크 카운터 탭 → 목록 뷰의 즐겨찾기 탭 열기 */
  document.getElementById("favFab").addEventListener("click",()=>{
    document.querySelector('#lvTabs .lv-tab[data-tab="fav"]').click();
    setView("list");
  });

  /* 목록 탭 [전체|즐겨찾기|위시리스트] */
  document.querySelectorAll("#lvTabs .lv-tab").forEach(tab=>{
    tab.addEventListener("click",()=>{
      document.querySelectorAll("#lvTabs .lv-tab").forEach(t=>t.classList.toggle("active",t===tab));
      listTab=tab.dataset.tab; buildListView(); listView.scrollTop=0;
    });
  });

  function setView(mode){
    const isList=mode==="list";
    segMap.classList.toggle("active",!isList); segMap.setAttribute("aria-selected",String(!isList));
    segList.classList.toggle("active",isList); segList.setAttribute("aria-selected",String(isList));
    if(isList){ buildListView(); listView.scrollTop=0; }
    listView.classList.toggle("open",isList);
    document.body.classList.toggle("list-open",isList);
  }
  segMap.addEventListener("click",()=>setView("map"));
  segList.addEventListener("click",()=>setView("list"));
  listContent.addEventListener("click",e=>{
    const bm=e.target.closest(".lv-bm");
    if(bm){ toggleFav(bm.dataset.id); return; }   /* toggleFav → refreshListView가 갱신 */
    const it=e.target.closest(".lv-item");
    if(it){ setView("map"); focusBooth(it.dataset.id); }
  });

  /* ── 홀 선택 칩: 지도 모드 → 해당 홀로 fit / 목록 모드 → 목록 필터 ── */
  const HALL_RECTS={A:HALL_BOUNDS.A,B1:HALL_BOUNDS.B1};
  function fitHall(r){
    const vb=svg.viewBox.baseVal;
    if(!r){state.scale=1;state.tx=0;state.ty=0;applyTransform();return;}
    const s=Math.min(state.maxScale,Math.min(vb.width/r.w,vb.height/r.h)*0.92);
    state.scale=s;
    state.tx=vb.width/2-s*(r.x+r.w/2);
    state.ty=vb.height/2-s*(r.y+r.h/2);
    applyTransform();
  }
  function selectHall(hall){
    currentHall=hall;
    document.querySelectorAll("#hallChips .chip").forEach(c=>c.classList.toggle("active",c.dataset.hall===hall));
    if(listView.classList.contains("open")){ buildListView(); listView.scrollTop=0; }
    else fitHall(HALL_RECTS[hall]||null);
  }
  document.querySelectorAll("#hallChips .chip").forEach(chip=>{
    chip.addEventListener("click",()=>selectHall(chip.dataset.hall));
  });
  /* ⟲ 전체 보기 → 홀 필터도 '전체'로 동기화 (지도 모드 전용) */
  document.getElementById("zoomReset").addEventListener("click",()=>{
    currentHall="all";
    document.querySelectorAll("#hallChips .chip").forEach(c=>c.classList.toggle("active",c.dataset.hall==="all"));
  });
})();

/* ── 모바일 초기 뷰: A홀 입구 부근(647,1010) 기준 5배 확대 상태로 시작 ── */
(function(){
  if(!window.matchMedia("(max-width:760px)").matches) return;
  const vb=svg.viewBox.baseVal, s=5, cx=647, cy=1010;
  state.scale=s;
  state.tx=vb.width/2-s*cx;
  state.ty=vb.height/2-s*cy;
  applyTransform();
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js')); }
</script>
</body>
</html>
